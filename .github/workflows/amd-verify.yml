name: AMD verify

# MANUAL ONLY, deliberately.
#
# MI300X time is metered (roughly 1.71 to 3.47 USD per GPU-hour depending on
# provider). Firing this on every push is how a 20 USD/month habit becomes a
# 400 USD one. The free eight-job matrix in ci.yml still runs on every push and
# covers everything that does not need a GPU; this runs when you have something
# worth spending money to verify.
#
# There is deliberately no `schedule:` trigger. A weekly run on a metered device
# bills whether or not anything changed, and three tests assert this workflow
# stays dispatch-only. Adding a schedule should be a decision someone makes on
# purpose, with the cost in front of them, not something that arrives in a diff.
#
# Setup, once you have a device:
#   1. Rent an MI300X (AMD Developer Cloud credits, TensorWave, DigitalOcean).
#   2. On that box:  bash scripts/register-amd-runner.sh <url> <token>
#   3. Actions -> AMD verify -> Run workflow -> runner: self-hosted
#
# With runner: ubuntu-latest it is a free dry run. No AMD device exists there,
# so every suite reports SKIP with a reason and the job passes. That verifies
# the plumbing without spending anything, and is worth doing after any change
# to this file, because the alternative is discovering a YAML mistake on a
# machine that charges by the hour.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run. ubuntu-latest is a free dry run.
        type: choice
        options: [ubuntu-latest, self-hosted]
        default: ubuntu-latest
      arch:
        description: Offload arch (gfx942 = MI300X, gfx90a = MI250X)
        type: string
        default: gfx942
      limit:
        description: Max shapes per suite. Lower is cheaper.
        type: string
        default: "12"
      dtypes:
        description: Precisions to sweep, space separated.
        type: string
        default: "float32 float16 bfloat16"
      bench:
        description: Also time the kernels. Costs more GPU minutes.
        type: boolean
        default: true
      port:
        description: Also prove each kernel end to end through port.
        type: boolean
        default: true
      require_device:
        description: Fail if no AMD device is found, instead of skipping.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    # Hard ceiling, so a hung compile on a metered GPU cannot bill for hours.
    # Verify, bench and port across three precisions runs close to 45 minutes on
    # an MI300X, so the ceiling is set above that rather than at it: the point is
    # to stop a runaway, not to cut short a run that is working.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      # Only for the hosted dry run. A self-hosted AMD box already has the
      # interpreter that matters, the one with ROCm-built torch and
      # pytorch-triton-rocm, and installing a fresh Python here shadows it.
      - uses: actions/setup-python@v7
        if: ${{ inputs.runner == 'ubuntu-latest' }}
        with:
          python-version: "3.12"

      - name: Show what the runner actually has
        run: |
          echo "runner: ${{ inputs.runner }}"
          command -v hipcc && hipcc --version || echo "hipcc: not present"
          command -v rocm-smi && rocm-smi || echo "rocm-smi: not present"
          command -v rocminfo && rocminfo | grep -m1 gfx || echo "rocminfo: not present"

      # ROCm images ship a ROCm-built torch and pytorch-triton-rocm. Reinstalling
      # either from PyPI replaces them with NVIDIA builds and breaks the GPU you
      # are paying for, so the extra declares torch and nothing else.
      #
      # On a self-hosted box the interpreter to use is the one that already has
      # them. HIPBRIDGE_PYTHON names it; otherwise the conventional venv path is
      # tried. The checkout goes on PYTHONPATH rather than being installed, so a
      # CI run never rewrites what that venv points at.
      - name: Choose the interpreter
        id: py
        run: |
          PY="${HIPBRIDGE_PYTHON:-}"
          if [ -z "$PY" ] && [ -x "$HOME/hipbridge/.venv/bin/python" ]; then
            PY="$HOME/hipbridge/.venv/bin/python"
          fi
          if [ -z "$PY" ]; then PY="$(command -v python3 || command -v python)"; fi
          echo "using $PY"
          "$PY" -c "import sys; print(sys.version)"
          echo "python=$PY" >> "$GITHUB_OUTPUT"

      - name: Install
        run: |
          if [ "${{ inputs.runner }}" = "ubuntu-latest" ]; then
            pip install -e ".[verify,dev]"
          else
            echo "using the box's interpreter and its ROCm torch; nothing installed"
          fi

      - name: Capabilities
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: ${{ steps.py.outputs.python }} -m hipbridge.cli info

      # The whole point of a hardware run is to exercise the tuned kernels. When
      # Triton is missing every suite falls back to torch, and the run reports a
      # pass for a substitution it never attempted. That happened on the first CI
      # regeneration and the numbers looked entirely plausible: 126/126 across
      # six suites, measuring the fallback.
      - name: Refuse to measure the fallback
        if: ${{ inputs.runner != 'ubuntu-latest' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          ${{ steps.py.outputs.python }} -c "
          import sys
          from hipbridge import kernels
          if not kernels.available():
              sys.exit('[kernels] extra unavailable, so every candidate would be the '
                       'torch fallback. A hardware run that measures the fallback is '
                       'worse than none: it looks like a pass for a substitution that '
                       'was never made.')
          print('tuned Triton kernels are available')
          "

      - name: Build the dtype flags
        id: flags
        run: |
          flags=""
          for d in ${{ inputs.dtypes }}; do flags="$flags --dtype $d"; done
          echo "dtype=$flags" >> "$GITHUB_OUTPUT"

      - name: Verify against device
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          ${{ steps.py.outputs.python }} -m hipbridge.cli verify \
            --toolchain hipcc \
            --arch "${{ inputs.arch }}" \
            --limit "${{ inputs.limit }}" \
            ${{ steps.flags.outputs.dtype }} \
            --report \
            ${{ inputs.require_device == true && '--require' || '' }}

      - name: Benchmark against device
        if: ${{ inputs.bench }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          ${{ steps.py.outputs.python }} -m hipbridge.cli bench \
            --toolchain hipcc \
            --arch "${{ inputs.arch }}" \
            --runs 3 \
            --shapes 1x1024,1024x1024,4096x4096 \
            ${{ steps.flags.outputs.dtype }} \
            --report

      # Every substitutable kernel, proved end to end. Without this the artifact
      # mixes fresh reports with whatever port files happened to be committed,
      # which is precisely the drift the freshness check exists to catch.
      - name: Prove each kernel through port
        if: ${{ inputs.port }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          # port now exits 5 when it cannot prove, instead of 0. That is the
          # point of the change: a pipeline reading $? used to read "unproven"
          # as success. The hosted dry run has no device, so 5 is the expected
          # answer there, and only there.
          dry_run=${{ inputs.runner == 'ubuntu-latest' && 'true' || 'false' }}
          # Asked for, not listed. This loop hardcoded six names and omitted
          # rms_norm_rope, so the fused kernel was never proved end to end and
          # results/ carried six port reports for seven suites. A hardcoded list
          # goes stale the first time somebody adds a kernel and does not think
          # to look in a YAML file.
          kernels=$(${{ steps.py.outputs.python }} -c             "from hipbridge.verify.suites import BUILTIN; print(' '.join(s.name for s in BUILTIN))")
          echo "proving: $kernels"
          for k in $kernels; do
            echo "== $k"
            set +e
            ${{ steps.py.outputs.python }} -m hipbridge.cli port "examples/$k.cu"               --toolchain hipcc               --arch "${{ inputs.arch }}"               --limit "${{ inputs.limit }}"               --report
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then continue; fi
            if [ "$rc" -eq 5 ] && [ "$dry_run" = "true" ]; then
              echo "   exit 5, unprovable without a device, which is what a dry run is"
              continue
            fi
            exit $rc
          done

      # The reports carry the commit, host, device, toolchain and torch build
      # they were produced at, so an artifact from a run nobody watched is still
      # attributable months later. A result that lives only in a log is an
      # anecdote; this project has lost two of those to a droplet already.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hipbridge-results-${{ inputs.arch }}-${{ github.run_id }}
          path: results/
          if-no-files-found: warn

      - name: Show what changed against the committed results
        if: always()
        run: |
          echo "Reports differing from what is on this branch:"
          git --no-pager diff --stat -- results/ || true
          echo
          echo "Download the artifact above and commit it if these numbers"
          echo "should become the record."
