[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hipbridge"
version = "0.1.0"
description = "Recognize CUDA kernels, substitute verified AMD implementations, prove it numerically"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Corrina Alcoser" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
]

# Core stays deliberately light: a C++ frontend and pure-arithmetic analysis.
# Everything heavy lives behind an extra.
dependencies = [
    "libclang>=16.0",
]

[project.optional-dependencies]
# Each extra maps 1:1 to a src/hipbridge/<name>/ package that is a candidate
# for promotion to its own distribution later. Keep that mapping honest: an
# extra must declare what its package imports, and nothing else.
#
# Triton publishes Linux wheels only. The marker keeps `pip install .[kernels]`
# from hard-failing on Windows/macOS instead of degrading gracefully.
kernels = [
    "triton>=3.0; platform_system == 'Linux'",
]
# verify/ imports torch and nothing else. It must NOT declare triton: on a ROCm
# machine that pulls the NVIDIA-flavoured triton wheel over the
# pytorch-triton-rocm that ROCm PyTorch depends on, breaking the very GPU the
# harness was installed to test. On such a box triton arrives with the platform
# PyTorch, which is what hipbridge.kernels then picks up.
verify = [
    "torch>=2.4",
    # Not imported by verify/, but torch warns "Failed to initialize NumPy" on
    # every call without it and some torch interop paths need it outright.
    "numpy>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyyaml>=6.0",  # tests assert the CI workflows stay off paid runners
    # tomllib is stdlib from 3.11; requires-python is >=3.10, so back it up.
    "tomli>=2.0; python_version < '3.11'",
]
all = ["hipbridge[kernels,verify]"]

[project.scripts]
hipbridge = "hipbridge.cli:main"

[project.urls]
Repository = "https://github.com/Core-Creates/hipbridge"
Issues = "https://github.com/Core-Creates/hipbridge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: requires a physical GPU",
    "amd: requires an AMD GPU (ROCm)",
    "nvidia: requires an NVIDIA GPU (CUDA)",
]
